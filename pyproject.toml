[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Introduction to function calling in LLMs"
requires-python = ">=3.10"
dependencies = [
    "llm-sdk",
    "mypy>=1.19.1",
    "numpy>=1.24.0,<2.0",
    "torch==2.2.2",
    "pydantic>=2.12.0",
    "transformers>=4.45.0,<5.0.0",
    "tokenizers>=0.21.0,<0.22.0",
    "huggingface-hub>=0.20.0",
    "flake8>=7.4.1",
]
[tool.uv.sources]
llm-sdk = { path = "llm_sdk", editable = true }

[tool.uv]
override-dependencies = ["torch==2.2.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]